async function addComment(taskId) {
  const ta = document.getElementById('d-comment-ta');
  const text = ta.value.trim();
  if (!text && pendingFiles.length === 0) return;
  const task = byId(taskId); if (!task) return;
  ta.value = ''; ta.style.height = 'auto';
  document.getElementById('d-comment-actions').classList.remove('visible');
  const attachments = [...pendingFiles]; pendingFiles = [];
  const stored = attachments.length ? JSON.stringify({ text, attachments }) : text;
  const row = await sbAddComment(taskId, stored);
  task.comments.push(row && row.id
    ? fmtComment(row)
    : { id: nextCommentId++, text, attachments, time: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}) });
  render(); renderDrawer();
  setTimeout(() => { const el = document.getElementById('d-comments'); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
}
function cancelComment() {
  const ta = document.getElementById('d-comment-ta'); if (!ta) return;
  ta.value = ''; ta.style.height='auto';
  pendingFiles = [];
  const prev = document.getElementById('d-attach-previews'); if (prev) prev.innerHTML = '';
  document.getElementById('d-comment-actions').classList.remove('visible');
}
function deleteComment(taskId, commentId) {
  const task = byId(taskId); if (!task) return;
  task.comments = task.comments.filter(c => c.id !== commentId);
  sbDeleteComment(commentId);
  renderDrawer(); render();
}

async function addSubtaskComment(subtaskId) {
  const ta = document.getElementById('sub-comment-ta');
  const text = ta.value.trim();
  if (!text && pendingFiles.length === 0) return;
  const found = findSubtask(subtaskId); if (!found) return;
  const { sub } = found;
  ta.value = ''; ta.style.height = 'auto';
  document.getElementById('sub-comment-actions').classList.remove('visible');
  const attachments = [...pendingFiles]; pendingFiles = [];
  const stored = attachments.length ? JSON.stringify({ text, attachments }) : text;
  const row = await sbAddSubtaskComment(subtaskId, stored);
  if (!sub.comments) sub.comments = [];
  sub.comments.push(row && row.id
    ? fmtComment(row)
    : { id: nextCommentId++, text, attachments, time: new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}) });
  renderDrawer();
  setTimeout(() => { const el = document.getElementById('sub-comments'); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
}
function cancelSubtaskComment() {
  const ta = document.getElementById('sub-comment-ta'); if (!ta) return;
  ta.value = ''; ta.style.height='auto';
  pendingFiles = [];
  const prev = document.getElementById('sub-attach-previews'); if (prev) prev.innerHTML = '';
  document.getElementById('sub-comment-actions').classList.remove('visible');
}
function deleteSubtaskComment(subtaskId, commentId) {
  const found = findSubtask(subtaskId); if (!found) return;
  found.sub.comments = (found.sub.comments||[]).filter(c => c.id !== commentId);
  sbDeleteSubtaskComment(commentId);
  renderDrawer();
}

function switchTab(t) {
  currentTab = t;
  const isMobile = window.innerWidth <= 768;
  const activeId = t === 'board' ? 'board' : t === 'timeline' ? 'tl' : 'exp';
  ['board','tl','exp'].forEach(id => {
    document.getElementById('v-'+id).classList.toggle('active', id === activeId);
  });
  document.getElementById('tb-board').classList.toggle('active', t === 'board');
  document.getElementById('tb-tl').classList.toggle('active', t === 'timeline');
  document.getElementById('tb-exp').classList.toggle('active', t === 'expenses');
  document.querySelector('.filterbar').classList.toggle('hidden', t === 'expenses');
  if (isMobile) window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}
function setFilter(q, btn) {
  filterQ = q;
  // only deactivate period buttons
  btn.closest('.filterbar').querySelectorAll('.filter-btn').forEach(b => {
    if (b.id && b.id.startsWith('fq-') || !b.id) b.classList.remove('active');
  });
  // re-activate the correct status button
  const sf = document.getElementById('fs-' + (filterStatus === 'in-progress' ? 'inprogress' : filterStatus));
  if (sf) sf.classList.add('active');
  btn.classList.add('active'); render();
}
function setStatusFilter(s, btn) {
  filterStatus = s;
  ['fs-all','fs-todo','fs-inprogress','fs-done'].forEach(id => {
    const el = document.getElementById(id); if (el) el.classList.remove('active');
  });
  btn.classList.add('active'); render();
}
function render() { currentTab==='board' ? renderBoard() : currentTab==='timeline' ? renderTimeline() : renderExpenses(); }

/* ─── Add modal ─── */
function openAddModal() {
  // Rebuild category options dynamically
  document.getElementById('fc').innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<option value="${k}">${v.label}</option>`).join('');
  document.getElementById('add-dialog').classList.remove('hidden');
  setTimeout(()=>document.getElementById('ft').focus(),40);
}
function closeAddModal() { document.getElementById('add-dialog').classList.add('hidden'); document.getElementById('ft').value=''; }
async function saveNewTask() {
  const title = document.getElementById('ft').value.trim(); if (!title) { document.getElementById('ft').focus(); return; }
  const q = parseInt(document.getElementById('fq').value);
  const task = { id: nextId++, t: title, cat: document.getElementById('fc').value, q, status:'todo', dueDate:'', notes:'', comments:[], startMonth:QS[q].sm, endMonth:QS[q].em, open:false, order:tasks.length };
  tasks.push(task);
  closeAddModal(); render();
  await sbCreate(task); // writes back the real DB id
}

document.getElementById('add-dialog').addEventListener('click', e => { if(e.target===document.getElementById('add-dialog')) closeAddModal(); });
document.getElementById('new-cat-dialog').addEventListener('click', e => { if(e.target===document.getElementById('new-cat-dialog')) closeNewCatDialog(); });
document.addEventListener('keydown', e => {
  if (e.key==='Escape') {
    if (!document.getElementById('new-cat-dialog').classList.contains('hidden')) { closeNewCatDialog(); return; }
    if (drawerSubtaskId) { closeSubDrawer(); }
    else { closeAddModal(); if(drawerTaskId) closeDrawer(); }
  }
  if (e.key==='Enter' && !document.getElementById('add-dialog').classList.contains('hidden') && document.activeElement !== document.getElementById('ft')) saveNewTask();
  if (e.key==='Enter' && !document.getElementById('new-cat-dialog').classList.contains('hidden') && document.activeElement === document.getElementById('ncat-name')) saveNewCat();
});

loadCustomCats();
sbInit();
sbInitExpenses();
</script>
